[project]
name = "text2sql-specialist"
version = "0.1.0"
description = "ETL + QLoRA fine-tuning + execution-based eval for SQLite text-to-SQL"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "rich>=13.7",
]

[dependency-groups]
etl = [
    "pyarrow>=16",
    "huggingface_hub>=0.24",
    "sqlglot>=25",
    "tokenizers>=0.19",
]
eval = ["httpx>=0.27", "numpy>=1.26", "matplotlib>=3.8"]
app = ["gradio>=6.0,<7", "httpx>=0.27", "pandas>=2.2", "sqlglot>=25"]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text2sql"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts/prototypes", "data/eval/validate_chinook_eval.py", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
