# Mirrored by the config cell in notebooks/train_qlora_colab.ipynb (the notebook is what actually runs)
base_model: unsloth/Qwen2.5-Coder-1.5B-Instruct-bnb-4bit
max_seq_length: 2048
lora: {r: 16, alpha: 32, dropout: 0.0}
target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
epochs: 1
batch_size: 8
grad_accum: 2
learning_rate: 2.0e-4
lr_scheduler: cosine
warmup_ratio: 0.03
optimizer: adamw_8bit
weight_decay: 0.01
fp16: true          # T4 has no bf16
packing: false
eval_steps: 100
save_steps: 200
seed: 3407
